      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64b(IV)},key,b64b(CT));
    document.open();document.write(new TextDecoder("utf-8").decode(pt));document.close();
  }catch(e){err.textContent="Incorrect password";err.style.display="block"}
}
</script>
